services:
  - type: web
    name: email-job-scheduler
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: RATE_LIMIT_PER_SEC
        value: 5
      - key: CONCURRENCY_LIMIT
        value: 2
